name: Weekly Maple snapshot

on:
  schedule:
    # Monday 11:00 AM SGT (UTC+8) = Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx playwright install chromium

      - name: Collect weekly snapshot
        run: node scripts/collector.mjs

      - name: Validate history JSON
        run: node -e "const h=JSON.parse(require('fs').readFileSync('data/history.json','utf8')); if(!h.snapshots?.length) throw new Error('no snapshots'); console.log('OK:',h.snapshots.length,'snapshots');"

      - name: Commit and push
        run: |
          git config user.name 'maple-guild-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history.json
          git diff --cached --quiet || git commit -m "weekly guild snapshot $(date -u +%F)"
          git push

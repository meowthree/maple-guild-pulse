name: Weekly Maple snapshot

on:
  schedule:
    # 10:00 SGT Saturday = 02:00 UTC Saturday
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Collect Saturday snapshot
        run: node scripts/collector.mjs

      - name: Commit updated history
        run: |
          git config user.name 'maple-guild-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history.json
          git diff --cached --quiet || git commit -m "weekly guild snapshot $(date -u +%F)"
          git push
